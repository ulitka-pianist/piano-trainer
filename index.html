<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музыкальная улитка</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f0f4fa; min-height: 100vh; }
  header { background: #4a90d9; color: #fff; padding: 14px; text-align: center; }
  header h1 { font-size: 24px; margin-bottom: 8px; }
  #progress { height: 10px; background: #9cc3ec; border-radius: 5px; }
  #bar { height: 100%; width: 0%; background: #ffd54f; border-radius: 5px; transition: width .3s; }
  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }
  button.menu-btn { display: block; width: 100%; max-width: 340px; margin: 10px auto;
    padding: 14px; font-size: 18px; border: none; border-radius: 12px;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); color: #333; }
  .back { display: inline-block; margin-bottom: 10px; padding: 8px 16px;
    border: none; border-radius: 8px; background: #dbe7f5; color: #336; font-size: 15px; }
  .score { text-align: center; font-size: 17px; margin: 8px 0; color: #336; }
  .clef-label { text-align: center; font-size: 14px; color: #556; margin-bottom: 4px; }
  .toggle-mode { text-align: center; margin-bottom: 10px; }
  .toggle-mode button { padding: 6px 12px; font-size: 13px; border: none;
    border-radius: 6px; background: #e0e0e0; color: #333; }
  .toggle-mode button.active { background: #4a90d9; color: #fff; }

  .staff { position: relative; height: 150px; max-width: 340px; margin: 10px auto;
    background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .line { position: absolute; left: 12px; right: 12px; height: 2px; background: #444; }
  .note-head { position: absolute; width: 30px; height: 22px; background: #222;
    border-radius: 50%; transform: rotate(-20deg); left: calc(50% - 15px); }
  .note-stem { position: absolute; width: 3px; height: 46px; background: #222;
    left: calc(50% + 11px); }
  .ledger { position: absolute; height: 2px; background: #444; width: 48px;
    left: calc(50% - 24px); display: none; }
  .answers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .answers button { width: 45%; max-width: 150px; padding: 14px; font-size: 18px;
    border: none; border-radius: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .feedback { text-align: center; font-size: 18px; height: 24px; margin-top: 10px; }

  #fallArea { position: relative; height: 380px; max-width: 360px; margin: 0 auto;
    overflow: hidden; background: #e8f1fb; border-radius: 12px; }
  .fall-note { position: absolute; width: 44px; height: 44px; border-radius: 50%;
    color: #fff; font-weight: bold; display: flex; align-items: center;
    justify-content: center; font-size: 13px; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  #keys { display: flex; max-width: 360px; margin: 8px auto; }
  #keys button { flex: 1; height: 70px; background: #fff; border: 1px solid #ccd;
    border-radius: 0 0 8px 8px; font-size: 14px; color: #333; }
  #keys button:active { background: #ffd54f; }

  #piano { display: flex; justify-content: center; gap: 4px; max-width: 400px; margin: 10px auto; }
  #piano button { width: 13%; height: 90px; border: 1px solid #99a; border-radius: 0 0 6px 6px;
    background: #fff; font-size: 12px; color: #333; }
  #piano button:active { background: #ffd54f; }
  .msg { text-align: center; font-size: 17px; margin-top: 12px; color: #336; min-height: 22px; }
</style>
</head>
<body>
<header>
  <h1>🐌 Музыкальная улитка</h1>
  <div id="progress"><div id="bar"></div></div>
</header>

<div id="menu" class="screen active">
  <button class="menu-btn" onclick="showScreen('guess')">Угадай ноту</button>
  <button class="menu-btn" onclick="showScreen('fall')">Падающие ноты</button>
  <button class="menu-btn" onclick="showScreen('tree')">Ёлочка (по нотам)</button>
</div>

<div id="guess" class="screen">
  <button class="back" onclick="showScreen('menu')">← Меню</button>
  <div class="toggle-mode">
    <button id="btnCam" class="active" onclick="toggleCam(true)">Камертон</button>
    <button id="btnStr" onclick="toggleCam(false)">Струна</button>
  </div>
  <div class="clef-label">Скрипичный ключ: 2-я линия снизу — Соль</div>
  <div class="staff">
    <div class="line" style="top:6px"></div>
    <div class="line" style="top:30px"></div>
    <div class="line" style="top:54px"></div>
    <div class="line" style="top:78px"></div>
    <div class="line" style="top:102px"></div>
    <div class="ledger" id="gLedger"></div>
    <div class="note-head" id="gHead"></div>
    <div class="note-stem" id="gStem"></div>
  </div>
  <div class="score">Очки: <span id="gScore">0</span></div>
  <div class="answers" id="gAnswers"></div>
  <div class="feedback" id="gFeedback"></div>
</div>

<div id="fall" class="screen">
  <button class="back" onclick="showScreen('menu')">← Меню</button>
  <div class="toggle-mode">
    <button id="btnCamF" class="active" onclick="toggleCam(true)">Камертон</button>
    <button id="btnStrF" onclick="toggleCam(false)">Струна</button>
  </div>
  <div class="score">Очки: <span id="fScore">0</span> · Промахи: <span id="fMiss">0</span></div>
  <div id="fallArea"></div>
  <div id="keys"></div>
</div>

<div id="tree" class="screen">
  <button class="back" onclick="showScreen('menu')">← Меню</button>
  <div class="toggle-mode">
    <button id="btnCamT" class="active" onclick="toggleCam(true)">Камертон</button>
    <button id="btnStrT" onclick="toggleCam(false)">Струна</button>
  </div>
  <div class="score">Уровень: <span id="tLevel">1</span></div>
  <div id="piano"></div>
  <div class="msg" id="tMsg">Слушай и повторяй!</div>
</div>

<script>
const NOTES = ['До','Ре','Ми','Фа','Соль','Ля','Си'];
const COLORS = ['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#5d4037'];
const NOTE_Y = [127, 115, 103, 91, 79, 67, 55];
const FREQ = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];

// Мелодии для падающих нот (индексы нот)
const MELODIES = [
  [4, 4, 4, 2, 5, 5, 4, 2, 4, 4, 4, 2, 5, 5, 4], // В лесу родилась ёлочка
  [0, 2, 0, 2, 0, 2, 2, 2, 0, 2, 0, 2, 0, 2, 2], // Жили у бабуси
  [3, 4, 5, 5, 3, 4, 5, 5, 3, 4, 5, 5, 3, 4, 5]  // Пусть бегут неуклюже
];

let audioCtx = null;
let useCamerton = true; // по умолчанию камертон

function toggleCam(isCam) {
  useCamerton = isCam;
  document.querySelectorAll('.toggle-mode button').forEach(b => b.classList.remove('active'));
  const btn = isCam ? document.getElementById('btnCam') || document.getElementById('btnCamF') || document.getElementById('btnCamT')
                    : document.getElementById('btnStr') || document.getElementById('btnStrF') || document.getElementById('btnStrT');
  if (btn) btn.classList.add('active');
}

function playNote(i) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const f = FREQ[i];

    if (useCamerton) {
      // Чистый камертон (синус)
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.8);
    } else {
      // Струнный тембр (гармоники + удар)
      const harmonics = [
        { mult: 1,    gain: 0.30, decay: 1.4 },
        { mult: 2,    gain: 0.14, decay: 0.9 },
        { mult: 3,    gain: 0.07, decay: 0.6 },
        { mult: 4.02, gain: 0.04, decay: 0.4 }
      ];
      harmonics.forEach(h => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = f * h.mult;
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(h.gain, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, t + h.decay);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + h.decay + 0.05);
      });
      const oN = audioCtx.createOscillator();
      const gN = audioCtx.createGain();
      oN.type = 'triangle';
      oN.frequency.value = f * 6;
      gN.gain.setValueAtTime(0.10, t);
      gN.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      oN.connect(gN); gN.connect(audioCtx.destination);
      oN.start(t); oN.stop(t + 0.08);
    }
  } catch (e) {}
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  stopFall();
  if (id === 'guess') newGuess();
  if (id === 'fall') startFall();
  if (id === 'tree') startTree();
}

function setProgress(score, max) {
  document.getElementById('bar').style.width = Math.min(100, Math.round(score / max * 100)) + '%';
}

/* --- Угадай ноту --- */
let gAnswer = 0, gScore = 0;
function newGuess() {
  gAnswer = Math.floor(Math.random() * 7);
  const y = NOTE_Y[gAnswer];
  document.getElementById('gHead').style.top = (y - 11) + 'px';
  document.getElementById('gStem').style.top = (y - 46) + 'px';
  const ledger = document.getElementById('gLedger');
  ledger.style.display = (gAnswer === 0) ? 'block' : 'none';
  ledger.style.top = (y - 1) + 'px';
  document.getElementById('gFeedback').textContent = '';
  const btns = document.getElementById('gAnswers');
  btns.innerHTML = '';
  NOTES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => {
      playNote(i);
      if (i === gAnswer) { gScore++; document.getElementById('gFeedback').textContent = 'Верно! 🐌'; }
      else { document.getElementById('gFeedback').textContent = 'Это ' + NOTES[gAnswer]; }
      document.getElementById('gScore').textContent = gScore;
      setProgress(gScore, 20);
      setTimeout(newGuess, 700);
    };
    btns.appendChild(b);
  });
}

/* --- Падающие ноты: мелодии, цвет клавиш = цвету ноты --- */
let fallTimer = null, spawnTimer = null, fScore = 0, fMiss = 0, melodyIdx = 0, notePos = 0;
function startFall() {
  const keys = document.getElementById('keys');
  keys.innerHTML = '';
  NOTES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.style.borderTop = '4px solid ' + COLORS[i];
    b.onclick = () => tapKey(i);
    keys.appendChild(b);
  });
  fScore = 0; fMiss = 0; notePos = 0;
  melodyIdx = Math.floor(Math.random() * MELODIES.length);
  document.getElementById('fScore').textContent = 0;
  document.getElementById('fMiss').textContent = 0;
  document.getElementById('fallArea').innerHTML = '';
  spawnTimer = setInterval(spawnNote, 400); // ритм мелодии
  fallTimer = setInterval(moveNotes, 30);
}
function stopFall() {
  clearInterval(fallTimer); clearInterval(spawnTimer);
  fallTimer = spawnTimer = null;
}
function spawnNote() {
  const area = document.getElementById('fallArea');
  if (area.children.length > 6) return;
  const n = MELODIES[melodyIdx][notePos % MELODIES[melodyIdx].length];
  notePos++;
  const d = document.createElement('div');
  d.className = 'fall-note';
  d.textContent = NOTES[n];
  d.style.background = COLORS[n];
  d.style.left = (n * 12.8 + 2) + '%';
  d.style.top = '-50px';
  d.dataset.note = n;
  area.appendChild(d);
}
function moveNotes() {
  const area = document.getElementById('fallArea');
  const H = area.clientHeight;
  [...area.children].forEach(d => {
    d.style.top = (parseFloat(d.style.top) + 2.4) + 'px';
    if (parseFloat(d.style.top) > H - 40) { d.remove(); fMiss++;
      document.getElementById('fMiss').textContent = fMiss; setProgress(fScore, 30); }
  });
}
function tapKey(i) {
  const area = document.getElementById('fallArea');
  let target = null, best = -1;
  [...area.children].forEach(d => {
    if (+d.dataset.note === i) {
      const t = parseFloat(d.style.top);
      if (t > best) { best = t; target = d; }
    }
  });
  if (target) {
    playNote(i);
    target.remove();
    fScore++;
    document.getElementById('fScore').textContent = fScore;
    setProgress(fScore, 30);
  }
}

/* --- Ёлочка: клавиши в ряд, как на пианино --- */
let tSeq = , tStep = 0, tLevel = 1, tPlaying = false;
function startTree() {
  tLevel = 1; tSeq = ; tStep = 0;
  document.getElementById('tLevel').textContent = 1;
  buildPiano();
  setTimeout(playSeq, 600);
}
function buildPiano() {
  const box = document.getElementById('piano');
  box.innerHTML = '';
  NOTES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.style.borderTop = '4px solid ' + COLORS[i];
    b.onclick = () => tapTree(i);
    box.appendChild(b);
  });
}
function playSeq() {
  tPlaying = true;
  tSeq.push(Math.floor(Math.random() * 7));
  tStep = 0;
  document.getElementById('tMsg').textContent = 'Слушай...';
  tSeq.forEach((n, k) => {
    setTimeout(() => { flash(n); playNote(n); }, 600 * k);
  });
  setTimeout(() => {
    tPlaying = false;
    document.getElementById('tMsg').textContent = 'Твоя очередь!';
  }, 600 * tSeq.length);
}
function flash(i) {
  const btns = document.querySelectorAll('#piano button');
  btns[i].style.background = '#ffd54f';
  setTimeout(() => { btns[i].style.background = '#fff'; }, 350);
}
function tapTree(i) {
  if (tPlaying) return;
  flash(i); playNote(i);
  if (i === tSeq[tStep]) {
    tStep++;
    if (tStep === tSeq.length) {
      document.getElementById('tMsg').textContent = 'Верно! 🐌';
      tLevel++;
      document.getElementById('tLevel').textContent = tLevel;
      setProgress(tLevel, 12);
      setTimeout(playSeq, 900);
    }
  } else {
    document.getElementById('tMsg').textContent = 'Почти! Начнём заново.';
    setTimeout(() => { tSeq = ; tStep = 0; playSeq(); }, 900);
  }
}
</script>
</body>
</html>
