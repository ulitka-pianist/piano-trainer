<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальная улитка</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background-color: #4a90e2; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .snail-icon { width: 32px; height: 32px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        h1 { margin: 0; font-size: 1.2rem; }
        
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 400px; margin: 40px auto; }
        .btn { background: white; border: none; padding: 20px; border-radius: 12px; font-size: 1rem; font-weight: 600; color: #333; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s, box-shadow 0.2s; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn:hover { box-shadow: 0 6px 12px rgba(0,0,0,0.15); }

        .piano-container { position: relative; display: flex; justify-content: center; margin-top: 20px; overflow-x: auto; padding-bottom: 20px; }
        .key { width: 40px; height: 160px; border: 1px solid #333; background: white; position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; user-select: none; cursor: pointer; transition: background 0.1s; }
        .key.active { background: #4a90e2; color: white; z-index: 10; }
        .key.wrong { background: #ff4d4d; color: white; }
        .key.white { border-left: 2px solid #333; border-right: 2px solid #333; }
        .key.black { width: 24px; height: 100px; background: #000; color: white; z-index: 5; margin-left: -12px; margin-right: -12px; }
        .key.black.active { background: #ff4d4d; }

        .note-fall-container { position: relative; height: 400px; background: #fff; border-radius: 12px; overflow: hidden; margin: 20px auto; max-width: 600px; border: 2px solid #ddd; }
        .falling-note { position: absolute; left: 50%; transform: translateX(-50%); font-size: 48px; font-weight: bold; color: #4a90e2; }
        
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .toggle-btn { background: #eee; padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; }
        .toggle-btn.active { background: #4a90e2; color: white; }

        .score-board { text-align: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; }
        .replay-btn { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .replay-btn:hover { background: #27ae60; }

        .tree-notes { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .tree-note { width: 50px; height: 50px; border-radius: 50%; background: #4a90e2; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .tree-note.played { background: #2ecc71; }
        .tree-note.wrong { background: #ff4d4d; }
    </style>
</head>
<body>

    <header>
        <div class="snail-icon">🐌</div>
        <h1>Музыкальная улитка</h1>
    </header>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menuScreen" class="screen active menu-grid">
        <button class="btn" onclick="showScreen('guess')">Угадай ноту</button>
        <button class="btn" onclick="showScreen('fall')">Падающие ноты</button>
        <button class="btn" onclick="showScreen('tree')">Ёлочка (по нотам)</button>
    </div>

    <!-- ЭКРАН 1: УГАДАЙ НОТУ -->
    <div id="guessScreen" class="screen">
        <h2>Угадай ноту!</h2>
        <p id="guessHint" style="text-align: center; margin-bottom: 20px;">Нажми на клавишу, чтобы услышать звук</p>
        <div class="piano-container" id="pianoGuess">
            <!-- Клавиши генерируются JS -->
        </div>
        <div class="controls">
            <button class="toggle-btn" id="camBtn1" onclick="toggleCam()">Камертон</button>
            <button class="toggle-btn" id="stringBtn1" onclick="toggleString()">Струна</button>
        </div>
        <button class="replay-btn" onclick="playCurrentNote()">Повторить звук</button>
        <button class="btn" onclick="showScreen('menu')">Назад в меню</button>
    </div>

    <!-- ЭКРАН 2: ПАДАЮЩИЕ НОТЫ -->
    <div id="fallScreen" class="screen">
        <h2>Падающие ноты</h2>
        <div class="score-board">Счёт: <span id="scoreFall">0</span></div>
        <div class="note-fall-container" id="fallContainer">
            <!-- Ноты падают сюда -->
        </div>
        <div class="controls">
            <button class="toggle-btn" id="camBtn2" onclick="toggleCam()">Камертон</button>
            <button class="toggle-btn" id="stringBtn2" onclick="toggleString()">Струна</button>
        </div>
        <button class="btn" onclick="showScreen('menu')">Назад в меню</button>
    </div>

    <!-- ЭКРАН 3: ЁЛОЧКА -->
    <div id="treeScreen" class="screen">
        <h2>Сыграй Ёлочку!</h2>
        <p style="text-align: center;">Нажимай на ноты в правильном порядке</p>
        <div class="tree-notes" id="treeNotes">
            <!-- Ноты ёлочки -->
        </div>
        <button class="replay-btn" onclick="replaySeq()">Повторить мелодию</button>
        <button class="btn" onclick="showScreen('menu')">Назад в меню</button>
    </div>

    <script>
        // --- НАСТРОЙКИ И СОСТОЯНИЕ ---
        const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const noteNames = {
            'C': 'До', 'D': 'Ре', 'E': 'Ми', 'F': 'Фа', 'G': 'Соль', 'A': 'Ля', 'B': 'Си'
        };
        
        // ИСПРАВЛЕНО: теперь массивы инициализируются корректно
        let tSeq = ; 
        let tStep = 0;
        let tLevel = 1;
        let tPlaying = false;
        
        let currentNote = 'C';
        let isCamerton = true; // true = камертон, false = струна
        let score = 0;
        let gameInterval;
        let fallNotes = ; // ИСПРАВЛЕНО: пустой массив

        // --- ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ---
        document.addEventListener('DOMContentLoaded', () => {
            initPiano();
            initTree();
            updateToggleButtons();
        });

        // --- УПРАВЛЕНИЕ ЭКРАНАМИ ---
        function showScreen(screenId) {
            // Скрываем все экраны
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none';
            });
            
            // Показываем нужный
            const target = document.getElementById(screenId + 'Screen');
            if (target) {
                target.style.display = 'block';
                target.classList.add('active');
            }
        }

        // --- ГЕНЕРАЦИЯ КЛАВИАТУРЫ ---
        function initPiano() {
            const container = document.getElementById('pianoGuess');
            container.innerHTML = '';
            const keys = [
                { n: 'C', type: 'white' }, { n: 'C#', type: 'black' },
                { n: 'D', type: 'white' }, { n: 'D#', type: 'black' },
                { n: 'E', type: 'white' },
                { n: 'F', type: 'white' }, { n: 'F#', type: 'black' },
                { n: 'G', type: 'white' }, { n: 'G#', type: 'black' },
                { n: 'A', type: 'white' }, { n: 'A#', type: 'black' },
                { n: 'B', type: 'white' }
            ];

            keys.forEach(k => {
                const key = document.createElement('div');
                key.className = `key \${k.type}`;
                key.innerText = k.type === 'white' ? noteNames[k.n.replace('#', '')] : '';
                key.onclick = () => checkNote(k.n);
                container.appendChild(key);
            });
        }

        // --- ЛОГИКА ИГРЫ "УГАДАЙ НОТУ" ---
        function pickRandomNote() {
            const idx = Math.floor(Math.random() * notes.length);
            currentNote = notes[idx];
            document.getElementById('guessHint').innerText = `Что это за нота? (Это \${noteNames[currentNote]})`;
            document.getElementById('guessHint').style.color = '#666';
        }

        function checkNote(playedNote) {
            // Упрощенная проверка для теста
            const isCorrect = playedNote.split('#') === currentNote;
            const keys = document.querySelectorAll('#pianoGuess .key');
            
            keys.forEach(k => k.classList.remove('active', 'wrong'));
            
            const pressedKey = keys[Array.from(keys).findIndex(k => k.innerText === noteNames[playedNote.split('#')])];
            if(pressedKey) pressedKey.classList.add(isCorrect ? 'active' : 'wrong');

            if (isCorrect) {
                setTimeout(pickRandomNote, 1000);
                playSound(currentNote);
            } else {
                setTimeout(() => pressedKey.classList.remove('wrong'), 500);
            }
        }

        function playSound(note) {
            // Заглушка для звука, чтобы не было ошибок
            console.log("Звук ноты: " + note);
        }

        // --- ЛОГИКА "ПАДАЮЩИЕ НОТЫ" ---
        function startFallGame() {
            score = 0;
            document.getElementById('scoreFall').innerText = score;
            clearInterval(gameInterval);
            gameInterval = setInterval(spawnNote, 1500);
        }

        function spawnNote() {
            const note = notes[Math.floor(Math.random() * notes.length)];
            const el = document.createElement('div');
            el.className = 'falling-note';
            el.innerText = noteNames[note];
            el.style.top = '-50px';
            
            const container = document.getElementById('fallContainer');
            container.appendChild(el);
            fallNotes.push({ el, note, speed: 2 });
        }

        function updateFall() {
            fallNotes.forEach((item, index) => {
                item.el.style.top = (parseInt(item.el.style.top || 0) + item.speed) + 'px';
                if (parseInt(item.el.style.top) > 350) {
                    item.el.remove();
                    fallNotes.splice(index, 1);
                }
            });
            requestAnimationFrame(updateFall);
        }
        
        // Запуск анимации падения сразу при загрузке (для теста)
        updateFall();

        // --- ЛОГИКА "ЁЛОЧКА" ---
        function initTree() {
            const container = document.getElementById('treeNotes');
            container.innerHTML = '';
            const melody = ['C', 'C', 'G', 'G', 'A', 'A', 'G']; // Простая ёлочка
            
            melody.forEach((note, idx) => {
                const btn = document.createElement('div');
                btn.className = 'tree-note';
                btn.innerText = noteNames[note];
                btn.onclick = () => checkTreeNote(idx, note);
                container.appendChild(btn);
            });
        }

        function checkTreeNote(idx, note) {
            const allNotes = document.querySelectorAll('.tree-note');
            if (idx === tStep) {
                allNotes[idx].classList.add('played');
                tStep++;
                if (tStep >= 7) {
                    alert("Ура! Ты сыграл Ёлочку!");
                    replaySeq();
                }
            } else {
                allNotes[idx].classList.add('wrong');
                setTimeout(() => allNotes[idx].classList.remove('wrong'), 500);
            }
        }

        function replaySeq() {
            tStep = 0;
            const allNotes = document.querySelectorAll('.tree-note');
            allNotes.forEach(n => n.classList.remove('played', 'wrong'));
            alert("Слушай мелодию: До-До-Соль-Соль-Ля-Ля-Соль");
        }

        // --- ПЕРЕКЛЮЧАТЕЛИ ЗВУКА ---
        function toggleCam() {
            isCamerton = true;
            document.getElementById('camBtn1').classList.add('active');
            document.getElementById('stringBtn1').classList.remove('active');
            document.getElementById('camBtn2').classList.add('active');
            document.getElementById('stringBtn2').classList.remove('active');
        }

        function toggleString() {
            isCamerton = false;
            document.getElementById('camBtn1').classList.remove('active');
            document.getElementById('stringBtn1').classList.add('active');
            document.getElementById('camBtn2').classList.remove('active');
            document.getElementById('stringBtn2').classList.add('active');
        }

        function updateToggleButtons() {
            toggleCam();
        }
    </script>
</body>
</html>
